channels:
  - nvidia
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.3.2
  - pandas>=2.2.2
  - scipy>=1.13
  - pytorch>=2.3
  - pint
  - pint-pandas
  - pytest
  - biotite>=1.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1      # must match your driver capability
  - libgcc-ng>=12
  - libstdcxx-ng>=12
  - pip
  - pip:
      - torch-geometric>=2.5
      - torch-scatter      # version must match installed torch; pip will choose
      - fair-esm
