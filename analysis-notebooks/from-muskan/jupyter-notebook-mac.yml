name: energetic-origins2
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - seaborn
  - matplotlib
  - networkx
  - biopython
  - tqdm
  - statsmodels
  - jupyterlab
  - ipykernel
  - ipywidgets
  - pyyaml

  # exact versions are avoided to prevent solver conflicts on macOS
  - pip
  - pip:
      - shap
      - numba
      - llvmlite
      - imbalanced-learn
      - cloudpickle
      - slicer

