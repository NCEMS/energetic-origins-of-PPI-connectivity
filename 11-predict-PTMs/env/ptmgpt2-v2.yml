name: ptmgpt2
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

channel_priority: strict

dependencies:
  - python=3.11

  # Match upstream pickle writer and avoid pandas 2.x pickle incompatibility
  - pandas=3.0.3
  - numpy=2.3.2

  # CUDA-enabled PyTorch stack.
  # The critical package is pytorch-cuda=12.1 from pytorch/nvidia channels.
  # nodefaults + strict priority prevents accidentally pulling CPU pytorch from pkgs/main.
  - pytorch=2.3.1
  - torchvision=0.18.1
  - torchaudio=2.3.1
  - pytorch-cuda=12.1

  # PTMGPT2 / transformer dependencies
  - transformers=4.29.2
  - tokenizers=0.13.3
  - scikit-learn>=1.5
  - tqdm
  - requests
  - certifi
  - packaging
  - pint
  - pint-pandas
  - ittapi

  # Runtime compatibility
  - libgcc-ng>=12
  - libstdcxx-ng>=12

  - pip
  - pip:
      - evaluate==0.4.0
      - huggingface_hub==0.16.4
