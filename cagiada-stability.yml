name: cagiada-stability
channels:
  - pytorch
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - biopython
  - biotite=0.41.0
  - numpy=1.26.4
  - scipy
  - pandas
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - torchaudio==2.1.0+cu121
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2
      - fair-esm
